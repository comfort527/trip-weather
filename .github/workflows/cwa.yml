# 每 3 小時向中央氣象署抓一次全臺各縣市一週預報，更新 data/cwa.json。
# 授權碼存在 repo 的 Settings → Secrets and variables → Actions，名稱 CWA_KEY。
name: 更新中央氣象署預報

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cwa-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取中央氣象署預報
        env:
          CWA_KEY: ${{ secrets.CWA_KEY }}
        run: node .github/scripts/fetch-cwa.mjs data/cwa.json

      - name: 有變動才提交
        run: |
          if git diff --quiet -- data/cwa.json; then
            echo "預報沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa.json
          git commit -m "更新中央氣象署預報"
          git pull --rebase origin main
          git push origin HEAD:main
